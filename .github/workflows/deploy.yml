# Deploy to Vercel production when a GitHub Release is published.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — Vercel account token (vercel.com/account/tokens)
#   VERCEL_ORG_ID      — from .vercel/project.json after running `vercel link`
#   VERCEL_PROJECT_ID  — from .vercel/project.json after running `vercel link`
#
# The app's runtime env vars (AUTH_*, FALKORDB_*, GH_TOKEN, CRON_SECRET) are
# configured in the Vercel project itself, not here.

name: Deploy (Vercel Production)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
